<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEDEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>The Week's Table</title>
<script>/* apply the saved theme before first paint */try{var t=JSON.parse(localStorage.getItem('mp_theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mast-top">
      <h1>The Week’s Table</h1>
      <div class="head-acts">
        <div class="sync" id="syncBox"></div>
        <button class="icon-btn bell" data-notes aria-label="Notifications"></button>
        <button class="ghost-btn" id="dashBtn">Profile &amp; tracker</button>
      </div>
    </div>
    <p class="sub">Morning drink, breakfast, shake, lunch and dinner, sized for each of you. Weekday lunches come from last night’s dinner, so dinners cook a double batch.</p>
    <div class="pview" id="pviewD"></div>
    <div class="controls" hidden>
      <div class="plan-for"><div class="seg" id="seg"></div></div>
      <div class="units"><div class="seg" id="unitseg"></div></div>
    </div>
  </header>

  <div class="sec-head">
    <h2>The week</h2><span class="hint" id="weekLabel"></span><span class="rule"></span>
    <button class="ghost-btn solid" data-gen>✦ Generate</button>
    <button id="grocery" class="ghost-btn">Grocery list</button>
    <button id="reset" class="ghost-btn">Starter plan</button>
  </div>
  <div class="cal-scroll"><div class="cal" id="cal"></div></div>

  <div class="sec-head"><h2>Plan queue</h2><span class="hint">placed first when you Generate</span><span class="rule"></span><button class="ghost-btn solid" data-gen>✦ Generate</button></div>
  <div class="queue">
    <h3>Staged recipes <span class="cnt" id="qcount">0</span></h3>
    <div class="q-strip" id="qstrip"></div>
  </div>

  <div class="sec-head"><h2>Recipes</h2><span class="hint" id="libcount"></span><span class="rule"></span></div>
  <div class="toolbar">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search recipes, ingredients, tags…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
    <button id="newRecipe" class="new-btn">+ New recipe</button>
  </div>
  <div class="filters cuisines" id="cuisines"></div>
  <div class="bento" id="lib"></div>

  <footer id="footer"></footer>
</div>

<!-- ================= mobile app ================= -->
<div id="mApp">
  <header class="m-top">
    <div class="m-top-row">
      <h1 class="brand">The Week’s Table</h1>
      <div class="top-acts">
        <button class="icon-btn bell" data-notes aria-label="Notifications"></button>
        <button class="m-avatar" id="mProfile" aria-label="Open profile and tracker"></button>
      </div>
    </div>
    <div class="pview" id="pviewM"></div>
  </header>
  <main class="m-main">
    <section class="m-panel" data-panel="today" id="mToday" hidden></section>
    <section class="m-panel" data-panel="discover" hidden>
      <div class="m-title"><h2 class="m-h2">Discover</h2><span class="hint" id="mLibCount"></span></div>
      <div class="search m-search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="mSearch" type="text" enterkeyhint="search" placeholder="Search recipes, ingredients, tags…" autocomplete="off"></div>
      <div class="filters m-chips" id="mFilters"></div>
      <div class="filters m-chips cuisines" id="mCuisines"></div>
      <div class="bento" id="mLib"></div>
      <button class="m-btn ghost wide" id="mNewRecipe" style="margin-top:14px">+ New recipe</button>
    </section>
    <section class="m-panel" data-panel="grocery" id="mGrocery" hidden></section>
    <section class="m-panel" data-panel="queue" id="mQueue" hidden></section>
  </main>
  <nav class="m-tabs" id="mTabs" aria-label="Sections"></nav>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheetTitle">
  <div class="sheet-grab"></div>
  <div class="sheet-head"><div><div class="d-ctx" id="sheetCtx"></div><h2 class="d-name" id="sheetTitle"></h2></div><button class="drawer-x" id="sheetX" aria-label="Close">×</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Detail">
  <div class="drawer-head"><button class="drawer-x" id="drawerX" aria-label="Close">×</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/foods.js"></script>
<script src="js/recipes.js"></script>
<script src="js/recipes-library.js"></script>
<script src="js/recipes-snacks.js"></script>
<script src="js/model.js"></script>
<script src="js/sync.js"></script>
<script src="js/motion.js"></script>
<script src="js/look.js"></script>
<script src="js/ui.js"></script>
<script src="js/trackers.js"></script>
</body>
</html>
